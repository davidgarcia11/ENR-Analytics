openapi: 3.0.3
info:
  title: Elaborados Naturales — API de escaneo de palets
  version: 1.2.0
  description: |
    API para avisar a Elaborados Naturales de cada palet escaneado contra una orden
    de fabricación. Una respuesta correcta confirma que el mensaje ha llegado y
    cumple el contrato.

    **Autenticación:** cabecera `x-api-key` con la clave que facilita Elaborados
    Naturales. Las claves de **prueba** (`enr_test_…`) sirven para desarrollar y
    probar: lo enviado con ellas se registra, pero no tiene ningún efecto. Las
    **reales** (`enr_live_…`) se facilitan al pasar a producción.

    **Formato:** cuerpo JSON con la cabecera `Content-Type: application/json`. **Todos
    los valores van como texto, entre comillas.** El SSCC tiene 18 cifras y como
    número JSON perdería precisión, así que un número se rechaza. Solo se admiten
    los campos del esquema.

    **Errores:** siempre con la misma forma, `{ "ok": false, "codigo": "…", "errores":
    ["…"] }`. El `codigo` es fijo (para decidir qué hacer sin leer textos) y
    `errores` explica qué falla, uno por línea.

    **Reintentos:** si no hay respuesta, llega un `500` o un `429` (tras esperar
    `Retry-After`), reintentar con el **mismo `id`**: el reintento se reconoce y no
    se registra dos veces. Un `400`, `401`, `409`, `413` o `415` no se reintentan:
    hay que corregir algo.

    **Límites:** como mucho **120 peticiones por minuto con cada clave** (por encima,
    `429` con `Retry-After`) y **10000 bytes** por mensaje (por encima, `413`). Un
    escaneo ocupa unos 200 bytes.
servers:
  - url: http://{servidor}:{puerto}
    description: Servidor de Elaborados Naturales (red interna)
    variables:
      servidor:
        default: localhost
        description: IP o nombre del servidor (lo facilita Elaborados Naturales)
      puerto:
        default: '3000'
security:
  - claveApi: []
tags:
  - name: Integración
    description: Avisos de palets escaneados
paths:
  /api/integracion/v1/escaneo:
    post:
      tags: [Integración]
      operationId: avisarEscaneo
      summary: Aviso de palet escaneado
      description: |
        Un mensaje por cada palet escaneado contra una orden de fabricación, con el
        resultado de la comprobación (`OK` si el artículo está en la orden, `NO_OK`
        si no). Solo se admiten los campos del esquema: cualquier otro se rechaza con un `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escaneo'
            examples:
              ok:
                summary: Escaneo correcto, con todos los campos
                value:
                  id: 3f2b8c1e-7a4d-4e9b-9c11-2d5e6f7a8b90
                  articulo: '1210500019'
                  resultado: OK
                  linea: '18'
                  lote: '263221'
                  sscc: '384123450000000017'
                  orden: '490387'
              noOk:
                summary: Artículo fuera de la orden
                value:
                  id: 7c9d0e1f-2a3b-4c5d-8e6f-9a0b1c2d3e4f
                  articulo: '1210500019'
                  resultado: NO_OK
                  linea: '18'
                  lote: '263221'
                  sscc: '384123450000000024'
                  orden: '490387'
              minimo:
                summary: Solo los campos obligatorios
                value:
                  articulo: '1210500019'
                  resultado: OK
                  linea: '18'
                  lote: '263221'
                  sscc: '384123450000000017'
                  orden: '490387'
      responses:
        '202':
          description: Recibido y registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recibido'
              examples:
                recibido:
                  value: { ok: true, id: 3f2b8c1e-7a4d-4e9b-9c11-2d5e6f7a8b90, estado: recibido, prueba: true }
                sinId:
                  summary: Sin id en el mensaje, se devuelve uno propio
                  value: { ok: true, id: '1542', estado: recibido, prueba: false }
        '200':
          description: Ese `id` ya se había recibido con los mismos datos (un reintento). No se registra otra vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recibido'
              examples:
                duplicado:
                  value: { ok: true, id: 3f2b8c1e-7a4d-4e9b-9c11-2d5e6f7a8b90, estado: duplicado, prueba: true }
        '400':
          description: |
            Datos incorrectos: el cuerpo no es JSON, falta un campo, tiene mal formato
            o hay un campo que no está en el contrato. `errores` dice cuáles y por qué,
            todos a la vez. No reintentar: corregir el mensaje.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                campos:
                  summary: Varios campos mal
                  value:
                    ok: false
                    codigo: DATOS_INCORRECTOS
                    errores:
                      - 'articulo: deben ser 10 cifras'
                      - 'resultado: debe ser "OK" o "NO_OK"'
                      - 'sscc: deben ser 18 cifras, sin el (00)'
                falta:
                  summary: Falta un obligatorio
                  value: { ok: false, codigo: DATOS_INCORRECTOS, errores: ['linea: es obligatorio'] }
                conIdentificador:
                  summary: SSCC con el (00) delante (20 cifras)
                  value: { ok: false, codigo: DATOS_INCORRECTOS, errores: ['sscc: tiene 20 cifras y empieza por 00: quitad el (00) del principio, el SSCC son las 18 cifras siguientes'] }
                campoDeMas:
                  summary: Un campo que no está en el contrato
                  value: { ok: false, codigo: DATOS_INCORRECTOS, errores: ['motivo: campo no admitido'] }
                numero:
                  summary: Un valor como número en vez de texto
                  value: { ok: false, codigo: DATOS_INCORRECTOS, errores: ['sscc: debe ir como texto, entre comillas'] }
                json:
                  summary: El cuerpo no es JSON válido
                  value: { ok: false, codigo: DATOS_INCORRECTOS, errores: ['El cuerpo no es un JSON válido'] }
        '401':
          description: |
            Sin clave, o la clave no vale (no existe, está revocada o caducada, o no
            da acceso a esta API). No se dice el motivo. No reintentar: revisar la
            clave con Elaborados Naturales. No se registra nada.
          headers:
            WWW-Authenticate:
              description: 'Cómo autenticarse: `ApiKey realm="integracion", header="x-api-key"`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                clave:
                  value: { ok: false, codigo: CLAVE_NO_VALIDA, errores: ['Clave no válida (cabecera x-api-key)'] }
        '409':
          description: |
            Ese `id` ya se había recibido, pero con **otros datos**. Cada mensaje
            necesita un `id` distinto; un reintento lleva el mismo `id` y los mismos
            datos. No reintentar: revisar cómo se generan los `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflicto:
                  value: { ok: false, codigo: ID_EN_CONFLICTO, errores: ['id: «3f2b8c1e-7a4d-4e9b-9c11-2d5e6f7a8b90» ya se recibió con otros datos; cada mensaje necesita un id distinto'] }
        '413':
          description: |
            El cuerpo pasa de 10000 bytes. No se lee entero ni se reintenta: un escaneo
            ocupa unos 200 bytes, así que hay un error en lo que se envía.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                grande:
                  value: { ok: false, codigo: DEMASIADO_GRANDE, errores: ['El cuerpo ocupa demasiado (máximo 10000 bytes)'] }
        '415':
          description: |
            Falta la cabecera `Content-Type: application/json` o tiene otro tipo. No
            reintentar sin corregirla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                tipo:
                  value: { ok: false, codigo: TIPO_NO_ADMITIDO, errores: ['El cuerpo tiene que enviarse como JSON (cabecera Content-Type: application/json, no text/plain)'] }
        '429':
          description: |
            Más de 120 peticiones en un minuto con la misma clave. Esperar los segundos
            de `Retry-After` y reintentar con el mismo `id`. No se registra nada.
          headers:
            Retry-After:
              description: Segundos que faltan para poder volver a enviar.
              schema:
                type: integer
                example: 23
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                limite:
                  value: { ok: false, codigo: DEMASIADAS_PETICIONES, errores: ['Demasiadas peticiones: como mucho 120 por minuto con cada clave'] }
        '500':
          description: Error interno. Reintentar 2-3 veces con el mismo `id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                interno:
                  value: { ok: false, codigo: ERROR_INTERNO, errores: ['Error interno del servidor; reintentad con el mismo id'] }
components:
  securitySchemes:
    claveApi:
      type: apiKey
      in: header
      name: x-api-key
      description: Clave de prueba (`enr_test_…`) o real (`enr_live_…`), facilitada por Elaborados Naturales.
  schemas:
    Escaneo:
      type: object
      required: [articulo, resultado, linea, lote, sscc, orden]
      additionalProperties: false
      properties:
        articulo:
          type: string
          pattern: '^\d{10}$'
          description: Código largo del artículo en JDE (10 cifras).
          example: '1210500019'
        resultado:
          type: string
          enum: [OK, NO_OK]
          description: '`OK` si el artículo está en la orden; `NO_OK` si no.'
          example: OK
        linea:
          type: string
          pattern: '^\d+$'
          maxLength: 10
          description: Número de la línea donde se ha escaneado, solo cifras (p. ej. `18`), sin códigos ni nombres.
          example: '18'
        lote:
          type: string
          minLength: 1
          maxLength: 30
          description: Lote de la orden, tal cual en JDE.
          example: '263221'
        sscc:
          type: string
          pattern: '^\d{18}$'
          description: |
            SSCC del palet escaneado, siempre 18 cifras, sin el identificador `(00)`.
            Puede empezar por 0 o por 00 (por eso va como texto: como número perdería
            esos ceros). Con el `00` delante serían 20 cifras y se rechaza.
          example: '384123450000000017'
        orden:
          type: string
          pattern: '^\d+$'
          maxLength: 20
          description: Nº de la orden de fabricación, solo cifras.
          example: '490387'
        id:
          type: string
          maxLength: 64
          description: |
            Identificador único del mensaje, generado por quien envía (p. ej. un UUID).
            Opcional pero recomendado: con él, un reintento (mismo `id`, mismos datos)
            no se registra dos veces; el mismo `id` con otros datos da `409`.
          example: 3f2b8c1e-7a4d-4e9b-9c11-2d5e6f7a8b90
    Recibido:
      type: object
      required: [ok, id, estado, prueba]
      properties:
        ok:
          type: boolean
          enum: [true]
        id:
          type: string
          description: El `id` del mensaje o, si no lo traía, uno asignado al registrarlo.
        estado:
          type: string
          enum: [recibido, duplicado]
        prueba:
          type: boolean
          description: '`true` si llegó con una clave de prueba.'
    Error:
      type: object
      required: [ok, codigo, errores]
      properties:
        ok:
          type: boolean
          enum: [false]
        codigo:
          type: string
          enum: [CLAVE_NO_VALIDA, DEMASIADAS_PETICIONES, TIPO_NO_ADMITIDO, DEMASIADO_GRANDE, DATOS_INCORRECTOS, ID_EN_CONFLICTO, ERROR_INTERNO]
          description: Código fijo del error, para decidir qué hacer sin leer los textos.
        errores:
          type: array
          items:
            type: string
          description: 'Qué falla, un texto por problema (en los datos: «campo: qué falla»).'
